name: Manual verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e 'server[dev]'
      - run: python -m pytest server/tests -q
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/wrapper-validation@v4
      - name: Supply Firebase client configuration if not tracked
        env:
          FIREBASE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f android/app/google-services.json ]; then
            test -n "$FIREBASE_JSON" || { printf 'Configure GOOGLE_SERVICES_JSON repository secret.\n'; exit 1; }
            printf '%s' "$FIREBASE_JSON" > android/app/google-services.json
          fi
      - name: Unit tests and internal APK (never production signing)
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleInternal
      - uses: actions/upload-artifact@v4
        with:
          name: nexo-internal-debug-signed
          path: android/app/build/outputs/apk/internal/*.apk
          if-no-files-found: error
